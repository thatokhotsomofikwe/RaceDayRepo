name: Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build API and Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Find project files
        id: projects
        shell: bash
        run: |
          find . -type f -name '*.csproj' \
            -not -path '*/obj/*' \
            -not -path '*/bin/*' \
            | sort > projects.txt

          if [ ! -s projects.txt ]; then
            echo "No .csproj files were found."
            echo "Check that the C# project files are committed to GitHub."
            exit 1
          fi

          echo "Projects found:"
          cat projects.txt

      - name: Restore dependencies
        shell: bash
        run: |
          while IFS= read -r project; do
            echo "Restoring $project"
            dotnet restore "$project"
          done < projects.txt

      - name: Build API and projects
        shell: bash
        run: |
          while IFS= read -r project; do
            echo "Building $project"
            dotnet build "$project" \
              --configuration Release \
              --no-restore
          done < projects.txt

      - name: Run unit tests
        shell: bash
        run: |
          found_tests=false

          while IFS= read -r project; do
            case "$(basename "$project")" in
              *Test*.csproj)
                found_tests=true
                echo "Testing $project"
                dotnet test "$project" \
                  --configuration Release \
                  --no-build \
                  --no-restore
                ;;
            esac
          done < projects.txt

          if [ "$found_tests" = false ]; then
            echo "::warning::No test projects were found. Build succeeded, but unit tests were not run."
          fi
